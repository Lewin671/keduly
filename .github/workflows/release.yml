name: Build and release

# Every push to main checks the tree and builds every platform. Pushing a tag
# such as v0.3.0 (it must match version.properties) also publishes a GitHub
# release: the CLI archives that install.sh and `keduly update` download, the
# signed Android APK, and latest.properties, which the app reads to update
# itself. The tag's annotation becomes the release notes.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: github.ref_type == 'tag'
        run: python3 scripts/release-manifest.py check "$GITHUB_REF_NAME"
      - run: scripts/check.sh
      - run: VERSION="$GITHUB_REF_NAME" scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests and lint
        run: ./android/gradlew --no-daemon -p android :app:testDebugUnitTest :app:lintRelease
      # Only a release is signed with the fixed key: every published APK must
      # carry the same signature, or installs could not update from one to the next.
      - name: Restore the release key
        if: github.ref_type == 'tag'
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 scripts/android-signing.py
      - name: Signed APK
        if: github.ref_type == 'tag'
        run: ./android/gradlew --no-daemon -p android :app:assembleRelease -PofficialRelease=true
      - name: Remove the release key
        if: always()
        run: rm -f "$HOME/.config/keduly/release.jks" "$HOME/.config/keduly/signing.properties"
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [checks, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # actions/checkout leaves an annotated tag pointing at the commit; fetch the tag object for its message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Package the APK and its manifest
        run: |
          apk="keduly-android-$GITHUB_REF_NAME.apk"
          cp apk/app-release.apk "dist/$apk"
          python3 scripts/release-manifest.py manifest "$GITHUB_REF_NAME" "dist/$apk" > dist/latest.properties
          (cd dist && sha256sum "$apk" >> checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag --list "$GITHUB_REF_NAME" --format='%(contents)' | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] && [ -n "$notes" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
