# Example: Keduly behind Caddy, which obtains the HTTPS certificate.
# Copy to deploy/local/ (ignored by git) and adjust the host name.
services:
  keduly:
    image: keduly
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      KEDULY_BASE_URL: https://keduly.example.com
      KEDULY_REGISTRATION: open # set to "closed" once your account exists
    volumes:
      - keduly-data:/data
    read_only: true # the server writes only to /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true # Caddy writes only to /data and /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  keduly-data:
  caddy-data:
  caddy-config:
