name: Keduly
options:
  bundleIdPrefix: io.github.lewin671
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Keduly:
    type: application
    platform: iOS
    sources:
      - Keduly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lewin671.keduly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keduly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Cleartext HTTP to a local server is a development convenience: only the debug build
        # merges the App Transport Security exception into its Info.plist.
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
  KedulyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KedulyTests
    dependencies:
      - target: Keduly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Keduly:
    build:
      targets:
        Keduly: all
        KedulyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KedulyTests
