<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keduly 手机端设计稿</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; color: #1c1c1e; background: #ececea; font-synthesis: none; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- the page around the phones (not part of the product) ---------- */
.page { max-width: 1340px; margin: 0 auto; padding: 30px 36px 80px; }
.mast { display: flex; align-items: center; gap: 11px; }
.mast svg { width: 30px; height: 30px; }
.mast strong { font-size: 20px; letter-spacing: -.5px; }
.mast span { margin-left: auto; font-size: 11px; letter-spacing: 1px; color: #76777a; }
.intro { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 26px 0 20px; }
.intro h1 { font-size: 30px; letter-spacing: -1px; }
.intro p { font-size: 13px; color: #76777a; }
.ctl { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 14px 0; background: #ececea; border-top: 1px solid #d5d6d3; border-bottom: 1px solid #d5d6d3; font-size: 12px; color: #6f7174; }
.ctl > div { display: flex; align-items: center; gap: 9px; }
.dseg { display: flex; background: #dddeda; border-radius: 8px; padding: 3px; }
.dseg button { padding: 6px 13px; border-radius: 6px; font-size: 12px; color: #55575a; }
.dseg button.on { background: #fff; color: #1c1c1e; box-shadow: 0 1px 3px #0002; }
.board { display: grid; grid-template-columns: repeat(auto-fill, 390px); justify-content: center; gap: 44px 38px; padding: 30px 0 10px; }
.cap { margin: 0 6px 12px; min-height: 56px; }
.cap b { display: block; font-size: 14px; }
.cap span { display: block; font-size: 12px; line-height: 1.55; color: #6f7174; margin-top: 3px; }

/* ---------- phone ---------- */
.phone { width: 390px; height: 844px; border-radius: 54px; background: #000; box-shadow: 0 0 0 9px #1d1d1f, 0 0 0 10px #0003, 0 26px 50px #1c253a22; position: relative; }
.screen {
  --bg: #fff; --grouped: #f2f2f7; --cell: #fff; --label: #1c1c1e; --label2: rgba(60, 60, 67, .62); --label3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .16); --fill: rgba(120, 120, 128, .12); --fill2: rgba(120, 120, 128, .2);
  --tint: #2867d6; --red: #ff3b30; --orange: #f08c00; --green: #34c759; --blue: #007aff; --indigo: #5856d6; --purple: #af52de; --teal: #30b0c7; --tomato: #f25c45;
  --glass: rgba(255, 255, 255, .78); --glass-edge: rgba(0, 0, 0, .06); --mix: #000; --seg-on: #fff;
  position: absolute; inset: 0; border-radius: 54px; overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg); color: var(--label); font-size: 17px; line-height: 22px; letter-spacing: -.2px; font-variant-numeric: tabular-nums;
}
.screen.dark {
  --bg: #000; --grouped: #000; --cell: #1c1c1e; --label: #fff; --label2: rgba(235, 235, 245, .62); --label3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .6); --fill: rgba(120, 120, 128, .24); --fill2: rgba(120, 120, 128, .36);
  --tint: #6c9dff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158; --blue: #0a84ff; --indigo: #7d7aff; --purple: #bf5af2; --teal: #40c8e0; --tomato: #ff6b55;
  --glass: rgba(40, 40, 43, .78); --glass-edge: rgba(255, 255, 255, .1); --mix: #fff; --seg-on: #636366;
}
.screen.grouped { background: var(--grouped); }
.sb { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 30px 0 38px; font-size: 16px; font-weight: 600; position: relative; z-index: 5; }
.sb i { position: absolute; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; }
.sb span { display: flex; align-items: center; gap: 6px; }
.sb svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }
.home { position: absolute; left: 50%; bottom: 8px; width: 138px; height: 5px; margin-left: -69px; border-radius: 3px; background: var(--label); z-index: 30; }

/* navigation bar: back to the parent on the left, at most two actions on the right */
.nav { height: 44px; flex: none; display: flex; align-items: center; padding: 0 8px; }
.nav .back { display: flex; align-items: center; height: 44px; padding: 0 8px 0 2px; color: var(--tint); font-size: 17px; }
.nav .back svg { width: 26px; height: 26px; stroke-width: 2.2; margin-right: -3px; }
.nav .sp { flex: 1; }
.nav .nb { width: 44px; height: 44px; display: grid; place-items: center; color: var(--tint); position: relative; }
.nav .nb svg { width: 24px; height: 24px; }
.nav .txt { height: 44px; padding: 0 10px; font-size: 17px; color: var(--red); }
.badge { position: absolute; top: 5px; right: 3px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; letter-spacing: 0; box-shadow: 0 0 0 2px var(--bg); }
.grouped .badge { box-shadow: 0 0 0 2px var(--grouped); }
.body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 20px 118px; position: relative; }
.body::-webkit-scrollbar { display: none; }
.lt { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.6px; margin: 2px 0 6px; display: flex; align-items: center; gap: 10px; }
.lt small { font-size: 17px; font-weight: 400; color: var(--label2); letter-spacing: -.2px; align-self: flex-end; padding-bottom: 5px; }
.lt .ring { width: 26px; height: 26px; }
.sub { font-size: 15px; line-height: 20px; color: var(--label2); }
.summary { font-size: 15px; line-height: 21px; color: var(--label2); margin: 2px 0 14px; }
.summary b { color: var(--label); font-weight: 600; }
.summary .warn { color: var(--red); font-weight: 600; }
.link { color: var(--tint); font-size: 15px; padding: 10px 0; display: block; }

/* ---------- item row ---------- */
.sec { display: flex; align-items: baseline; gap: 8px; padding: 22px 0 7px; border-bottom: .5px solid var(--sep); }
.sec:first-child { padding-top: 10px; }
.sec b { font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -.4px; }
.sec b svg { width: 17px; height: 17px; vertical-align: -2px; margin-right: 5px; color: var(--indigo); fill: currentColor; stroke: none; }
.sec em { font-style: normal; font-size: 13px; color: var(--label2); }
.sec span { margin-left: auto; font-size: 13px; color: var(--label2); white-space: nowrap; }
.sec.over b { color: var(--red); }
.it { display: flex; gap: 12px; padding-left: 1px; }
.chk { width: 22px; height: 22px; flex: none; margin-top: 11px; border-radius: 7px; border: 1.6px solid var(--label3); display: grid; place-items: center; }
.chk.on { background: var(--tint); border-color: var(--tint); }
.chk.on::after { content: ""; width: 10px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.it-b { flex: 1; min-width: 0; padding: 10px 0 10px; border-bottom: .5px solid var(--sep); }
.it-h { display: flex; gap: 10px; }
.it:last-child .it-b { border-bottom: 0; }
.it-t { flex: 1; min-width: 0; font-size: 17px; line-height: 22px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.imp { color: var(--orange); font-weight: 800; margin-right: 5px; }
.it-s { display: flex; align-items: center; gap: 0; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--label2); white-space: nowrap; overflow: hidden; }
.it-s > * { flex: none; }
.it-s > * + *::before { content: "·"; margin: 0 5px; color: var(--label3); }
.it-s .pj { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.tom { width: 13px; height: 13px; vertical-align: -2px; margin-right: 2px; color: var(--tomato); fill: none; }
.tom.off { color: var(--label3); }
.due { color: var(--label2); }
.due.hot { color: var(--red); }
.it-r { flex: none; padding-top: 2px; font-size: 13px; line-height: 18px; color: var(--label2); white-space: nowrap; text-align: right; }
.tent { border: 1px dashed var(--label3); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
.run { color: var(--tint); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.it.done .it-t { color: var(--label2); text-decoration: line-through; }
.more { color: var(--tint); font-size: 15px; padding: 10px 0 2px 35px; display: block; }
.blank { padding: 150px 26px 0; text-align: center; color: var(--label2); font-size: 15px; line-height: 21px; }
.blank b { display: block; color: var(--label); font-size: 20px; line-height: 25px; font-weight: 600; margin-bottom: 6px; }
.none { font-size: 15px; color: var(--label3); padding: 12px 0 4px 35px; }

/* today's events: small and quiet, the items are what the page is for */
.evs { display: grid; gap: 5px; margin: 0 0 4px; }
.ev { display: flex; align-items: center; gap: 9px; font-size: 15px; line-height: 20px; color: var(--label2); min-width: 0; }
.ev time { flex: none; width: 43px; font-size: 13px; }
.ev i { flex: none; width: 3px; height: 16px; border-radius: 2px; background: var(--c); }
.ev.tentative i { background: repeating-linear-gradient(var(--c) 0 3px, transparent 3px 5px); }
.ev span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev em { flex: none; font-style: normal; font-size: 12px; border: 1px dashed var(--label3); border-radius: 6px; padding: 0 5px; line-height: 17px; }

/* ---------- lists root ---------- */
.search { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 9px; margin: 6px 0 18px; border-radius: 10px; background: var(--fill); color: var(--label2); font-size: 17px; }
.search svg { width: 18px; height: 18px; stroke-width: 2; }
.grp { background: var(--cell); border-radius: 14px; overflow: hidden; }
.grp-h { font-size: 13px; line-height: 18px; color: var(--label2); padding: 22px 16px 7px; }
.gr { display: flex; align-items: center; gap: 13px; padding-left: 16px; min-height: 48px; width: 100%; }
.gr > svg { color: var(--c, var(--tint)); width: 23px; height: 23px; }
.gr .ring { width: 21px; height: 21px; margin: 0 1px; }
.gr-b { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 48px; padding-right: 12px; border-bottom: .5px solid var(--sep); }
.gr:last-child .gr-b { border-bottom: 0; }
.gr-b b { flex: 1; min-width: 0; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-b em { font-style: normal; color: var(--label2); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
.gr-b em.hot { color: var(--red); }
.gr-b .chev { width: 15px; height: 15px; stroke-width: 2.4; color: var(--label3); }
.gr.act b { color: var(--tint); }
.sw { width: 51px; height: 31px; border-radius: 16px; background: var(--fill2); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px #0003; }
.sw.on { background: var(--green); }
.sw.on::after { left: 22px; }

/* ---------- project page ---------- */
.pnote { font-size: 15px; line-height: 21px; color: var(--label2); margin: 0 0 10px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.pt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }

/* ---------- calendar ---------- */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 4px 0 12px; }
.seg button { flex: 1; height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; text-align: center; }
.seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 0 0 .5px #0000000a, 0 3px 8px #0000001f; }
.wd, .mg { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin: 0 -8px; }
.wd { font-size: 11px; line-height: 13px; color: var(--label3); padding-bottom: 4px; font-weight: 600; }
.mg button { height: 50px; display: grid; justify-items: center; align-content: start; gap: 3px; padding-top: 3px; text-align: center; }
.mg b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 400; letter-spacing: -.4px; }
.mg .we b { color: var(--label2); }
.mg .today b { color: var(--red); font-weight: 600; }
.mg .sel b { background: var(--label); color: var(--bg); font-weight: 600; }
.mg .sel.today b { background: var(--red); color: #fff; }
.mg u { display: flex; gap: 3px; height: 6px; text-decoration: none; }
.mg u i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.mg u i.o { background: none; border: 1.3px solid var(--c); }
.dayh { display: flex; align-items: baseline; gap: 8px; margin: 6px -20px 0; padding: 11px 20px 9px; border-top: .5px solid var(--sep); font-size: 17px; font-weight: 600; }
.dayh span { font-size: 15px; font-weight: 400; color: var(--label2); }
.dayh em { margin-left: auto; font-style: normal; font-size: 13px; font-weight: 400; color: var(--label2); }
.ag { display: flex; gap: 11px; padding: 0; min-height: 50px; align-items: stretch; }
.ag time { flex: none; width: 43px; padding-top: 7px; font-size: 13px; line-height: 18px; color: var(--label); }
.ag time span { display: block; color: var(--label2); }
.ag > i { flex: none; width: 4px; margin: 7px 0; border-radius: 2px; background: var(--c); }
.ag.tentative > i { background: repeating-linear-gradient(var(--c) 0 4px, transparent 4px 7px); }
.ag-b { flex: 1; min-width: 0; padding: 6px 0 7px; border-bottom: .5px solid var(--sep); }
.ag:last-child .ag-b { border-bottom: 0; }
.ag-b b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-b span { display: block; font-size: 13px; line-height: 18px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin: 0 -8px; }
.strip button { display: grid; justify-items: center; gap: 3px; text-align: center; font-size: 11px; line-height: 13px; font-weight: 600; color: var(--label3); padding-bottom: 6px; }
.strip b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 400; color: var(--label); letter-spacing: -.4px; }
.strip .sel b { background: var(--red); color: #fff; font-weight: 600; }
.allday { display: flex; gap: 6px; align-items: center; margin: 0 -20px; padding: 6px 20px 6px 12px; border-top: .5px solid var(--sep); font-size: 11px; color: var(--label2); }
.allday span { width: 44px; text-align: right; flex: none; }
.allday b { flex: 1; min-width: 0; height: 24px; line-height: 24px; padding: 0 9px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 20%, var(--bg)); color: color-mix(in srgb, var(--c) 62%, var(--mix)); }
.tlw { margin: 0 -20px; border-top: .5px solid var(--sep); overflow-y: auto; scrollbar-width: none; flex: 1; min-height: 0; }
.tlw::-webkit-scrollbar { display: none; }
.tl { position: relative; margin: 10px 12px 130px 0; --h: 58px; }
.hr { height: var(--h); position: relative; }
.hr span { position: absolute; left: 0; top: -7px; width: 50px; text-align: right; font-size: 11px; line-height: 13px; font-weight: 500; color: var(--label2); }
.hr::after { content: ""; position: absolute; left: 58px; right: 0; top: 0; border-top: .5px solid var(--sep); }
.col { position: absolute; left: 60px; right: 0; top: 0; bottom: 0; }
.blk { position: absolute; border-radius: 7px; padding: 4px 6px 3px 10px; overflow: hidden; font-size: 13px; line-height: 17px; background: color-mix(in srgb, var(--c) 18%, var(--bg)); color: color-mix(in srgb, var(--c) 64%, var(--mix)); }
.blk::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--c); }
.blk b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk.tall b { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.blk span { display: block; font-size: 11.5px; line-height: 15px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.short { display: flex; align-items: center; gap: 6px; padding-top: 0; padding-bottom: 0; }
.blk.short b { flex: 0 1 auto; }
.blk.short span { flex: none; }
.blk.tentative { background: color-mix(in srgb, var(--c) 5%, var(--bg)); border: 1px dashed color-mix(in srgb, var(--c) 62%, var(--bg)); }
.blk.tentative::before { display: none; }
.blk.tentative b { font-weight: 500; }
.blk.task { padding-left: 30px; background: color-mix(in srgb, var(--c) 11%, var(--bg)); }
.blk.task::before { left: 8px; top: 6px; bottom: auto; width: 15px; height: 15px; border-radius: 5px; background: none; border: 1.4px solid color-mix(in srgb, var(--c) 70%, var(--bg)); }
.blk.plus { background: var(--fill); color: var(--label2); padding-left: 7px; }
.blk.plus::before { display: none; }
.now { position: absolute; left: 0; right: 0; height: 0; z-index: 3; }
.now::before { content: ""; position: absolute; left: 56px; right: 0; border-top: 1.5px solid var(--red); }
.now::after { content: ""; position: absolute; left: 52px; top: -3.5px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
.now span { position: absolute; left: 6px; top: -9px; width: 44px; height: 18px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; letter-spacing: 0; }
.fill { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }

/* ---------- focus ---------- */
.fz { display: flex; flex-direction: column; align-items: center; height: 100%; text-align: center; }
.fz .lab { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--label2); margin-top: 6px; }
.dial { position: relative; width: 272px; height: 272px; margin-top: 18px; flex: none; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial circle { fill: none; stroke-width: 9; }
.dial .r0 { stroke: var(--fill); }
.dial .r1 { stroke: var(--c); stroke-linecap: round; }
.dial div { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; }
.dial b { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-size: 72px; line-height: 1; font-weight: 200; letter-spacing: -2px; }
.dial span { font-size: 13px; line-height: 18px; color: var(--label2); }
.dial .big { width: 92px; height: 92px; transform: none; color: var(--tomato); }
.pick { margin-top: 22px; max-width: 100%; padding: 0 6px; }
.pick b { font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: -.4px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.pick b svg { width: 14px; height: 14px; stroke-width: 2.6; color: var(--label3); vertical-align: 0; margin-left: 5px; }
.pick span { display: block; font-size: 15px; line-height: 20px; color: var(--label2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.round { display: flex; align-items: center; gap: 7px; margin-top: 18px; font-size: 13px; color: var(--label2); }
.round .tom { width: 22px; height: 22px; margin: 0; }
.round span { margin-left: 5px; }
.ftop { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.fa { width: 100%; display: flex; gap: 10px; }
.btn { flex: 1; height: 50px; border-radius: 25px; background: var(--fill); font-size: 17px; font-weight: 600; text-align: center; color: var(--label); }
.btn.go { background: var(--tint); color: #fff; }
.screen.dark .btn.go { color: #06122b; }
.ff { font-size: 13px; line-height: 18px; color: var(--label2); margin-top: 12px; }
.zen { background: color-mix(in srgb, var(--c) 9%, var(--bg)); }
.zen .body { padding-bottom: 40px; }
.pillb { display: flex; align-items: center; gap: 3px; height: 36px; padding: 0 14px 0 9px; margin-left: 8px; border-radius: 18px; background: var(--fill); font-size: 15px; font-weight: 500; }
.pillb svg { width: 17px; height: 17px; stroke-width: 2.4; }

/* statistics */
.figs { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; margin: 8px 0 22px; }
.figs b { display: block; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.6px; white-space: nowrap; }
.figs b small { font-size: 15px; font-weight: 600; letter-spacing: 0; margin-left: 1px; }
.figs span { display: block; font-size: 13px; line-height: 18px; color: var(--label2); }

  return { cls: 'grouped', nav: nav({ left: '<button class="back">取消</button>' }), body: `<div style="padding:36px 24px;text-align:center"><h2>在已登录的浏览器中授权</h2><p style="margin:16px 0;color:var(--label2)">打开授权链接，输入下面的确认码。授权后此设备会自动登录。</p><div style="font-size:36px;letter-spacing:12px;padding:24px 0">4826</div><p style="color:var(--label2);font-size:14px">等待授权 · 两分钟内有效</p><button style="display:block;margin:28px auto 16px;color:var(--tint)">在浏览器中授权</button><button style="color:var(--tint)">分享授权链接</button><p style="margin-top:20px;font-size:12px;color:var(--label2);overflow-wrap:anywhere">https://keduly.example.com/#approve=example</p><p style="margin-top:32px;color:var(--red)">授权已过期或取消</p><button style="margin-top:12px;color:var(--tint)">重新请求授权</button></div>` };
}

const SCREENS = [
  ['Device authorization', 'Sign-in offers 授权登录 after entering the server. The request shows a separate pin and an approval link to open or share with an already signed-in browser. Expiry and cancellation stop polling; retry is explicit. No password or claim secret is shown.', authorization],
  ['Items root', 'The top of the items tab: the lists, then projects grouped by area. The gear is only here.', lists],
  ['Matrix, the page the app opens on', 'The four quadrants stacked. A row is a title, one line of facts, and only the time on the right.', matrix],
  ['Today', 'One sentence on whether the day fits; events are a few quiet lines so the items stay on the first screen.', today],
  ['Project', 'Progress ring, notes, next events, then items under headings. Rows do not repeat the project name.', project],
  ['Item sheet (new item in the empty data set)', 'Tapping a row raises it. A suggestion gives its reason in place, with accept and reject.', () => today({ over: detailSheet() })],
  ['Calendar, month', 'Today is red, dots take the project colour, a hollow dot is tentative. The selected day is listed below.', month],
  ['Calendar, day (a timer is running)', 'Overlaps share up to three lanes. The strip above the tab bar leads back to the timer.', dayView],
  ['Focus, idle', 'The main button sits above the tab bar. Tapping the item picks another; statistics are at the top right.', focusIdle],
  ['Focus, working', 'Full screen, tinted with the project colour, no tab bar. 收起 returns to the page it came from.', focusRun],
  ['Focus, statistics', 'Four figures, a week of bars stacked by project colour, where the time went, the records.', stats],
];

function render() {
  load();
  document.getElementById('board').innerHTML = SCREENS.map(([title, note, fn], i) => {
    const s = fn();
    return `<section><div class="cap"><b>${i + 1}　${title}</b><span>${note}</span></div><div class="phone"><div class="screen ${theme === 'dark' ? 'dark' : ''} ${(s.cls || '').replace('fillb', '')}" style="${s.style || ''}">${statusbar()}${s.nav}<div class="body ${(s.cls || '').includes('fillb') ? 'fill' : ''}" data-scroll="${s.scroll || 0}">${s.body}</div>${s.tab ? tabs(s.tab, s) : ''}${s.over || ''}<i class="home"></i></div></div></section>`;
  }).join('');
  document.querySelectorAll('[data-scroll]').forEach(b => { const y = Number(b.dataset.scroll), t = b.querySelector('.tlw'); if (y && t) t.scrollTop = y; });
  document.querySelectorAll('[data-set]').forEach(b => b.classList.toggle('on', b.dataset.set === set));
  document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('on', b.dataset.theme === theme));
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-set]'), t = e.target.closest('[data-theme]');
  if (s) { set = s.dataset.set; render(); }
  if (t) { theme = t.dataset.theme; render(); }
});
render();
</script>
