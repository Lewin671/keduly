<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keduly 设计稿</title>
<style>
/* Colours follow Apple's system palette (light / dark). */
:root {
  --bg: #ffffff; --label: #1c1c1e; --label-2: rgba(60, 60, 67, .62); --label-3: rgba(60, 60, 67, .32);
  --sep: rgba(60, 60, 67, .14); --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .07);
  --group: #f5f5f7; --tile: #ffffff; --seg-on: #ffffff; --sheet: #ffffff;
  --glass: rgba(242, 242, 247, .78); --glass-edge: rgba(0, 0, 0, .07); --glass-hi: rgba(255, 255, 255, .7);
  --pop: rgba(255, 255, 255, .88);
  --tomato: #f25c45; --blue: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500; --indigo: #5856d6; --teal: #30b0c7; --pink: #ff2d55; --purple: #af52de; --brown: #a2845e; --gray: #8e8e93; --ink: #48484a;
  --mix: #000000; --shadow: 0 12px 40px rgba(0, 0, 0, .18), 0 0 0 .5px rgba(0, 0, 0, .1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1e; --label: #ffffff; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .62); --fill: rgba(118, 118, 128, .26); --fill-2: rgba(118, 118, 128, .14);
    --group: rgba(255, 255, 255, .055); --tile: rgba(255, 255, 255, .08); --seg-on: #636366; --sheet: #242426;
    --glass: rgba(44, 44, 46, .74); --glass-edge: rgba(0, 0, 0, .4); --glass-hi: rgba(255, 255, 255, .1);
    --pop: rgba(44, 44, 46, .9);
    --tomato: #ff6b55; --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --indigo: #7d7aff; --teal: #40c8e0; --pink: #ff375f; --purple: #bf5af2; --brown: #ac8e68; --ink: #8e8e93;
    --mix: #ffffff; --shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 0 0 .5px rgba(255, 255, 255, .14);
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1e; --label: #ffffff; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
  --sep: rgba(84, 84, 88, .62); --fill: rgba(118, 118, 128, .26); --fill-2: rgba(118, 118, 128, .14);
  --group: rgba(255, 255, 255, .055); --tile: rgba(255, 255, 255, .08); --seg-on: #636366; --sheet: #242426;
  --glass: rgba(44, 44, 46, .74); --glass-edge: rgba(0, 0, 0, .4); --glass-hi: rgba(255, 255, 255, .1);
  --pop: rgba(44, 44, 46, .9);
  --tomato: #ff6b55; --blue: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --indigo: #7d7aff; --teal: #40c8e0; --pink: #ff375f; --purple: #bf5af2; --brown: #ac8e68; --ink: #8e8e93;
  --mix: #ffffff; --shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 0 0 .5px rgba(255, 255, 255, .14);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--label);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; letter-spacing: -.1px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
h1, h2, h3, p { margin: 0; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
code, pre { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; letter-spacing: 0; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset: 1px; }
.glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(28px); backdrop-filter: saturate(180%) blur(28px); box-shadow: inset 0 0 0 .5px var(--glass-hi), 0 0 0 .5px var(--glass-edge), 0 8px 28px rgba(0, 0, 0, .07); }

/* ---------- task sidebar ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 10px; height: calc(100vh - 20px); margin: 10px 0 10px 10px; border-radius: 18px; padding: 12px 12px 4px; overflow-y: auto; display: flex; flex-direction: column; }
.mode { margin-bottom: 14px; }
.mode button { flex: 1; }
body[data-mode="cal"] #side-tasks, body[data-mode="cal"] #list, body[data-mode="tasks"] #side-cal, body[data-mode="tasks"] #cal, body[data-mode="tasks"] .only-cal { display: none; }
.mini { padding: 2px 2px 16px; }
.mini-h { font-size: 13px; font-weight: 600; padding: 0 7px 6px; }
.mini-g { display: grid; grid-template-columns: repeat(7, 1fr); justify-items: center; row-gap: 1px; font-size: 12px; }
.mini-g em { font-style: normal; color: var(--label-3); font-size: 10.5px; padding-bottom: 3px; }
.mini-g span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.mini-g .out { color: var(--label-3); }
.mini-g .today { background: var(--red); color: #fff; font-weight: 600; }
.pc { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--c); display: grid; place-items: center; flex: none; margin: 0 5px; }
.pc.on { background: var(--c); }
.pc.on::after { content: ""; width: 7px; height: 3.5px; border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(-45deg) translate(.5px, -.5px); }
.proj.off .pn { color: var(--label-2); }
.s-label { font-size: 13px; font-weight: 600; color: var(--label-2); padding: 0 8px 4px; }
.projects { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; margin-bottom: 18px; }
.proj { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px 0 6px; border-radius: 9px; width: 100%; text-align: left; }
.proj .pn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- items: sidebar ---------- */
.nav { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; }
.nv { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px; width: 100%; text-align: left; font-size: 14.5px; }
.nv svg { color: var(--c); }
.nv .n { margin-left: auto; color: var(--label-2); font-size: 13px; }
.nv.on { background: var(--fill); }
.nv.add { color: var(--label-2); margin-top: 8px; --c: var(--label-2); }
.area { font-size: 13px; font-weight: 700; padding: 18px 9px 4px; }
.pie { width: 16px; height: 16px; flex: none; margin: 0 1px; }

/* ---------- items: list ---------- */
.list { max-width: 700px; margin: 4px auto 0; padding-bottom: 90px; }
.lh { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 8px; }
.lh svg { width: 26px; height: 26px; color: var(--c); flex: none; margin-top: 4px; }
.lh h2 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; line-height: 1.3; overflow-wrap: anywhere; }
.notes, .summary { color: var(--label-2); font-size: 14px; margin: 0 0 12px 37px; max-width: 560px; }
.evs { margin: 0 0 16px 37px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.ev { display: flex; gap: 10px; font-size: 13px; line-height: 18px; color: var(--label-2); padding-left: 9px; border-left: 2px solid var(--c); }
.ev time { flex: none; min-width: 40px; }
.sec { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; padding: 24px 0 7px 2px; margin-bottom: 4px; border-bottom: .5px solid var(--sep); }
.sec svg { width: 16px; height: 16px; color: var(--c); }
button.sec { width: 100%; text-align: left; }
.dh { display: flex; align-items: baseline; gap: 10px; padding: 16px 0 4px 2px; margin-top: 12px; border-top: .5px solid var(--sep); }
.dh b { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.dh span { font-size: 14px; font-weight: 600; color: var(--label-2); }
.dh + .evs { margin-left: 2px; margin-bottom: 8px; }
.todo { border-radius: 9px; margin: 0 -10px; padding: 0 10px; }
.todo .tr { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; width: 100%; text-align: left; }
.todo .tm { flex: 1; min-width: 0; }
.todo .tt svg { width: 14px; height: 14px; color: #f5b400; vertical-align: -2px; margin-right: 5px; }
.todo .ts { color: var(--label-2); font-size: 12.5px; }
.todo .rt { display: flex; align-items: center; gap: 12px; color: var(--label-2); font-size: 13px; white-space: nowrap; padding-top: 1px; }
.flag { display: inline-flex; align-items: center; gap: 3px; }
.flag svg { width: 12px; height: 12px; stroke-width: 2; }
.flag.hot { color: var(--red); }
.chip-t { border: 1px dashed var(--label-3); border-radius: 5px; padding: 0 6px; font-size: 12px; line-height: 18px; }
.todo.done .tt { color: var(--label-2); text-decoration: line-through; }
/* An opened item becomes a card in place. */
.todo.open { background: var(--sheet); box-shadow: 0 0 0 .5px var(--glass-edge), 0 8px 26px rgba(0, 0, 0, .13); margin: 10px -16px; padding: 7px 16px 14px; animation: pop .2s cubic-bezier(.25, 1.1, .4, 1); transform-origin: center top; }
.todo.open .tt { font-weight: 600; }
.card { margin-left: 27px; }
.card .cn { color: var(--label-2); font-size: 14px; padding: 0 0 12px; }
.card .cn.ph { color: var(--label-3); }
.card .sg { display: flex; align-items: center; gap: 8px; background: var(--fill-2); border-radius: 9px; padding: 9px 9px 9px 12px; font-size: 13px; margin-bottom: 12px; }
.card .sg div { flex: 1; min-width: 0; }
.card .sg b { font-weight: 600; }
.card .cm { display: flex; flex-wrap: wrap; gap: 6px; }
.ck { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 6px; background: var(--fill); font-size: 12.5px; color: var(--label-2); }
.ck { max-width: 100%; overflow: hidden; white-space: nowrap; }
.ck svg { width: 13px; height: 13px; stroke-width: 1.9; flex: none; }
.ck i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.empty { color: var(--label-2); font-size: 14px; padding: 10px 0 0 37px; }
.chk { --c: var(--blue); width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--label-3); flex: none; display: grid; place-items: center; margin-top: 2px; transition: background .15s, border-color .15s; }
.chk::after { content: ""; width: 8px; height: 4px; border-left: 1.8px solid #fff; border-bottom: 1.8px solid #fff; transform: rotate(-45deg) translate(.5px, -1px) scale(0); transition: transform .2s cubic-bezier(.3, 1.5, .5, 1); }
.chk.on { background: var(--c); border-color: var(--c); }
.chk.on::after { transform: rotate(-45deg) translate(.5px, -1px) scale(1); }
.fab { position: fixed; right: 34px; bottom: 30px; z-index: 9; width: 52px; height: 52px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--blue) 40%, transparent); }
.fab svg { width: 24px; height: 24px; stroke-width: 2.2; }
body[data-mode="cal"] .fab { display: none; }

/* ---------- calendar ---------- */
.main { min-width: 0; padding: 16px 32px 48px 26px; }
.bar { display: flex; align-items: center; gap: 12px; min-height: 40px; margin-bottom: 18px; }
.bar h1 { font: 400 28px/1.15 -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; letter-spacing: -.5px; color: var(--label-2); white-space: nowrap; }
.bar h1 b { font-weight: 700; color: var(--label); margin-right: 4px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 10px; position: relative; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { height: 30px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--seg-on); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .12); }
.cap { display: flex; align-items: center; height: 34px; border-radius: 17px; background: var(--fill); font-size: 14px; font-weight: 500; }
.cap button { height: 34px; padding: 0 12px; display: grid; place-items: center; }
.cap button + button { border-left: .5px solid var(--sep); }
.cap svg { width: 15px; height: 15px; stroke-width: 2.2; }
.cap .red { color: var(--red); }
.rbtn { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; position: relative; flex: none; }
.rbtn.on { background: var(--blue); color: #fff; }
.rbtn svg { width: 17px; height: 17px; }
.badge { position: absolute; top: -4px; right: -5px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }

/* day and week */
.tl { display: grid; grid-template-columns: 50px minmax(0, 1fr); padding-top: 8px; --hour: 58px; }
.hours { position: relative; }
.hours div { height: var(--hour); color: var(--label-2); font-size: 11px; font-weight: 500; text-align: right; padding-right: 9px; transform: translateY(-7px); }
.nowcap { position: absolute; right: 4px; transform: translateY(-50%); background: var(--red); color: #fff; font-size: 11px; font-weight: 600; border-radius: 8px; padding: 1px 6px; z-index: 3; }
.col { position: relative; background: linear-gradient(var(--sep) 1px, transparent 1px) left top / 100% var(--hour) repeat-y; }
/* Every block takes its colour from its project. Events have a bar; tasks have a checkbox. */
.blk { position: absolute; border-radius: 6px; padding: 3px 7px 3px 10px; overflow: hidden; font-size: 12.5px; line-height: 1.32; display: flex; gap: 6px; align-items: flex-start; text-align: left; background: color-mix(in srgb, var(--c) 20%, var(--bg)); color: color-mix(in srgb, var(--c) 62%, var(--mix)); }
.blk .bx { min-width: 0; }
.blk .bt, .blk .bm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { font-weight: 600; }
.blk .bm { font-size: 11.5px; opacity: .78; }
.blk.short { align-items: center; padding-top: 0; padding-bottom: 0; }
.blk.short .bx { display: flex; gap: 7px; align-items: baseline; }
.blk.event::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--c); }
.blk.task { padding-left: 7px; background: color-mix(in srgb, var(--c) 12%, var(--bg)); }
/* Suggested by an agent, waiting for the user: same slot, dashed outline, lighter fill. */
.blk.tent { background: color-mix(in srgb, var(--c) 5%, var(--bg)); border: 1px dashed color-mix(in srgb, var(--c) 65%, var(--bg)); cursor: pointer; padding-left: 9px; }
.blk.tent::before { display: none; }
.blk.tent .bt { font-weight: 500; }
.blk.leaving { opacity: .5; cursor: pointer; }
.blk.leaving .bt { text-decoration: line-through; }
.blk.done { opacity: .45; }
.blk.done .bt { text-decoration: line-through; }
.blk .chk { width: 14px; height: 14px; border-radius: 4px; margin-top: 1.5px; border-width: 1.2px; border-color: color-mix(in srgb, var(--c) 70%, var(--bg)); }
.blk .chk::after { width: 6px; height: 3px; border-width: 1.5px; }
.blk.short .chk { margin-top: 0; }
.now { position: absolute; left: 0; right: 0; border-top: 1px solid var(--red); z-index: 2; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -4px; top: -4.5px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }

.wk-scroll { overflow-x: auto; }
.wk { display: grid; grid-template-columns: 50px repeat(7, minmax(98px, 1fr)); min-width: 750px; --hour: 48px; }
.wk-head { padding: 0 8px 9px; color: var(--label-2); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: flex-end; gap: 5px; border-bottom: .5px solid var(--sep); }
.wk-head b { font-weight: 400; font-size: 17px; color: var(--label); min-width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.wk-head.today { color: var(--red); }
.wk-head.today b { background: var(--red); color: #fff; font-weight: 600; font-size: 15px; }
.wk-gap { border-bottom: .5px solid var(--sep); }
.wk .col { border-left: .5px solid var(--sep); }
.wk .col.we { background-color: var(--fill-2); }
.wk .hours div:first-child { visibility: hidden; }
.wk .blk { padding: 2px 5px 2px 9px; gap: 5px; }
.wk .blk.task { padding-left: 5px; }
.wk .blk.short .bm { display: none; }

/* month */
.mo-head, .mo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mo-head div { text-align: right; padding: 0 8px 7px; color: var(--label-2); font-size: 13px; font-weight: 500; }
.mo { border-top: .5px solid var(--sep); }
.mcell { position: relative; min-height: 124px; padding: 5px 6px 6px; border-bottom: .5px solid var(--sep); border-left: .5px solid var(--sep); }
.mcell:nth-child(7n + 1) { border-left: 0; }
.mcell.we { background: var(--fill-2); }
.mday { display: flex; justify-content: flex-end; margin-bottom: 3px; font-size: 14px; }
.mday b { font-weight: 400; min-width: 24px; height: 24px; padding: 0 4px; display: grid; place-items: center; border-radius: 12px; }
.mcell.out .mday { color: var(--label-3); }
.mcell.today .mday b { background: var(--red); color: #fff; font-weight: 600; }
.me { display: flex; align-items: center; gap: 5px; width: 100%; font-size: 12px; line-height: 19px; text-align: left; }
.me i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.me.task i { background: none; border: 1.3px solid var(--c); width: 8px; height: 8px; }
.me.task.done i { background: var(--c); }
.me.done .mt { text-decoration: line-through; color: var(--label-2); }
.me .mt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .mx { color: var(--label-2); font-size: 11px; }
.me.tent { color: var(--label-2); cursor: pointer; }
.me.tent i { background: none; border: 1.3px dashed var(--c); width: 8px; height: 8px; }
.me.leaving { opacity: .5; cursor: pointer; }
.me.leaving .mt { text-decoration: line-through; }
.more { color: var(--label-2); font-size: 11.5px; padding-left: 12px; line-height: 18px; }

/* year */
.yr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 40px; max-width: 1180px; padding-top: 6px; }
.ym { text-align: left; align-self: start; display: block; }
.ym h3 { font-size: 19px; font-weight: 600; margin-bottom: 6px; padding-left: 4px; }
.ym.cur h3 { color: var(--red); }
.yg { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; justify-items: center; font-size: 12px; }
.yg em { font-style: normal; color: var(--label-3); font-size: 10.5px; padding-bottom: 2px; }
.yg span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.yg .h1 { background: color-mix(in srgb, var(--orange) 16%, transparent); }
.yg .h2 { background: color-mix(in srgb, var(--orange) 36%, transparent); }
.yg .h3 { background: color-mix(in srgb, var(--orange) 62%, transparent); }
.yg .today { background: var(--red); color: #fff; font-weight: 600; }

/* ---------- edge cases: long text, crowded days, empty lists ---------- */
.hours div:first-child { visibility: hidden; }
.cal-scroll { max-height: calc(100vh - 100px); overflow: auto; }
.allday { display: grid; grid-template-columns: 50px minmax(0, 1fr); padding-bottom: 6px; border-bottom: .5px solid var(--sep); }
.allday > span, .wk-adl { font-size: 11px; font-weight: 500; color: var(--label-2); text-align: right; padding: 3px 9px 0 0; }
.allday > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.ad { margin: 0 2px; height: 20px; line-height: 20px; border-radius: 5px; padding: 0 7px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 20%, var(--bg)); color: color-mix(in srgb, var(--c) 62%, var(--mix)); }
.wk-top { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; position: sticky; top: 0; z-index: 6; background: var(--bg); }
.wk-ad { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 2px 0; padding: 4px 0; border-bottom: .5px solid var(--sep); }
.blk.tall .bt { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.blk.narrow { padding-left: 8px; padding-right: 2px; }
.blk.narrow .bm, .blk.narrow .chk { display: none; }
.me.ad { display: block; width: auto; margin: 0 0 1px; height: 18px; line-height: 18px; font-size: 11.5px; padding: 0 6px; }
.todo .tt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.todo.open .tt { display: block; }
.nl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.rest { border-left-color: transparent; }
.sec span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>

const DAY_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

// Everything the ordinary week has, plus the cases that break layouts: long text, big counts,

    const gaps = mine.filter(unplanned).length, row = t => todoHTML(t, { star: true });
    const headings = [...new Set(live.filter(t => t.h).map(t => t.h))];
    const first = TODAY - mondayIndex(TODAY), week = sessions.filter(x => x.date >= first && x.date <= first + 6 && mine.some(t => t.id === x.task)).reduce((s, x) => s + (x.e - x.s) * 60, 0);
    return top + `<p class="summary">${left.length} 件未完成${left.length ? (gaps ? `，其中 ${gaps} 件还没排进日历` : '，都已排进日历') : ''}${week ? `；本周已专注 ${span(week)}` : ''}</p>`
      + eventsHTML(next, i => `${dayName(i.date)} ${i.allDay ? '全天' : hhmm(i.s)}`)
      + live.filter(t => !t.h).map(row).join('')
      + headings.map(h => {
        const list = live.filter(t => t.h === h), key = id + '/' + h, shut = collapsed.has(key);
        return `<button class="sec fold ${shut ? 'shut' : ''}" data-collapse="${key}">${icon('right', 'chev')}<span>${h}</span><em>${openOnes(list).length}</em></button>` + (shut ? '' : list.map(row).join(''));
      }).join('')
      + (logged.length ? `<button class="logged" data-showdone>${showDone ? '隐藏' : '显示'} ${logged.length} 件已完成</button>` + (showDone ? (loading.has('logged') ? skeleton(3) : paged('logged:' + id, logged, 10, row)) : '') : '');
  }
  if (filter === 'today') {
    const list = tasks.filter(t => t.g === 'today'), late = tasks.filter(t => overdue(t) && t.g !== 'today');
    // Important items lead the day.
    const day = list.filter(t => !t.evening).sort((a, b) => (b.imp ? 1 : 0) - (a.imp ? 1 : 0)), night = list.filter(t => t.evening), events = eventsOn(TODAY);
    const top = head(icon('star'), '今天', '#f5b400');
    if (!list.length && !late.length && !events.length) return top + blank('今天没有安排', '点右下角的加号添加事项，或者让 AI 帮你排：keduly plan --today');
    const free = freeHours(TODAY), gaps = day.filter(unplanned), need = gaps.reduce((s, t) => s + Math.max((t.est || 0) - usedMin(t.id) / 60, 0), 0);   // work left = estimate minus time already spent
    const keep = gaps.filter(t => t.imp).length, rest = gaps.length - keep;
    const verdict = need <= free ? '' : keep && rest ? `，排不下：先保住 ${keep} 件重要的，其余 ${rest} 件可以往后放` : '，排不下，需要取舍';
    const row = t => todoHTML(t, { sub: true });
    return top
      + `<p class="summary">${free <= 0 ? '18:00 前已经排满' : `18:00 前还有 ${dur(free)}空闲`}${gaps.length ? `，${gaps.length} 件事项未安排（${dur(need)}）${verdict}` : '，事项都已安排'}</p>`
      + eventsHTML(events)
      + (late.length ? `<div class="sec" style="--c:var(--red)">${icon('flag')}<span>逾期</span><em>${late.length}</em></div>` + late.map(row).join('') + `<div class="sec"><span>今天</span><em>${openOnes(day).length}</em></div>` : '')
      + day.map(row).join('')
      + (night.length ? `<div class="sec" style="--c:var(--indigo)">${icon('moon')}<span>今晚</span></div>` + night.map(row).join('') : '');
  }
  if (filter === 'upcoming') {
    // Day by day from tomorrow: that day's calendar events, then the items planned or due then.
    let html = '';
    for (let d = TODAY + 1; d <= 31; d++) {
      const list = tasks.filter(t => t.g !== 'today' && !done.has(t.id) && (t.date === d || (!t.date && t.dueDate === d))), events = eventsOn(d);
      if (!list.length && (d > TODAY + 4 || !events.length)) continue;
      html += `<div class="dh"><b>${d}</b><span>${dayName(d)}</span></div>` + eventsHTML(events, null, 4) + list.map(t => todoHTML(t, { sub: true, timeOnly: true })).join('');
    }
    if (!html) return head(icon('cal'), '计划', 'var(--red)') + blank('接下来没有计划', '给事项定一个日期，它就会出现在这里');
    // Only the current month is fetched up front; later months come on request.
    const later = [[2, '11月 · 周一', '季度复盘'], [9, '11月 · 周一', '续签租房合同']].map(([d, name, t]) => `<div class="dh"><b>${d}</b><span>${name}</span></div>
      <div class="todo"><div class="tr"><span class="chk"></span><div class="tm"><div class="tt">${t}</div></div></div></div>`).join('');
    return head(icon('cal'), '计划', 'var(--red)') + html
      + (more.nov ? later + '<p class="end">之后没有计划了</p>' : loading.has('nov') ? skeleton(3) : '<button class="morebtn" style="padding-left:2px;margin-top:10px" data-more="nov" data-to="1">加载 11 月</button>');
  }
  if (filter === 'matrix') {
    // Importance is the user's mark, urgency comes from the deadline; together they sort every open item into four boxes.
    const left = openOnes(tasks);
    if (!left.length) return head(icon('grid'), '四象限', 'var(--orange)') + blank('还没有事项', '有了事项之后，这里会按重要和紧急分成四格');
    const quad = (name, label, c, imp, urg) => {
      const list = left.filter(t => !!t.imp === imp && urgent(t) === urg), gaps = list.filter(unplanned).length;
      return `<div class="quad"><div class="quad-h" style="--c:${c}"><b>${name}</b><em>${label}</em><span>${list.length} 件${imp && !urg && gaps ? `，${gaps} 件还没排进日历` : ''}</span></div>
        ${paged('quad:' + name, list, 6, t => todoHTML(t, { sub: true })) || '<div class="none">没有事项</div>'}</div>`;
    };
    return head(icon('grid'), '四象限', 'var(--orange)') + '<p class="summary">重要由你标记；紧急按截止日期判断：已逾期，或今天、明天截止。</p>'
      + `<div class="matrix">${quad('马上做', '重要 · 紧急', 'var(--red)', true, true)}${quad('安排时间做', '重要 · 不紧急', 'var(--blue)', true, false)}
        ${quad('尽快处理掉', '不重要 · 紧急', 'var(--orange)', false, true)}${quad('有空再说', '不重要 · 不紧急', 'var(--gray)', false, false)}</div>`;
  }
  if (filter === 'all') {
    const html = Object.keys(PROJECTS).map(id => {
      const list = openOnes(tasks.filter(t => t.p === id));
      return list.length ? `<button class="sec" data-filter="p:${id}">${pie(id)}<span>${PROJECTS[id].name}</span><em>${list.length}</em></button>` + paged('all:' + id, list, 5, t => todoHTML(t, { star: true })) : '';
    }).join('');
    return head(icon('layers'), '全部', 'var(--teal)') + (html || blank('还没有事项', '先建一个项目，或者把想到的事记进收件箱'));
  }
  if (filter === 'done') {
    const list = tasks.filter(t => done.has(t.id)), top = head(icon('book'), '已完成', 'var(--green)');
    if (!list.length && !historyDepth) return top + blank('还没有完成的事项', '完成的事项会收在这里');
    // Newest first, one month per fetch; reaching the bottom of the page asks for the next month.
    const months = Math.min(logLoaded, historyDepth);
    let total = list.length, html = '';
    for (let k = 0; k < historyDepth; k++) total += historyCount(k);
    for (let k = 0; k < months; k++) html += historyMonth(k);
    return top + `<p class="summary">共 ${total} 件，按完成时间从近到远</p>`
      + (list.length ? `<div class="sec"><span>最近</span><em>${list.length}</em></div>` + list.map(t => todoHTML(t, { sub: true })).join('') : '') + html
      + (months < historyDepth ? `<div data-sentinel>${skeleton(3)}</div>` : '<p class="end">已经到最早的一件了</p>');
  }
  const inbox = tasks.filter(t => t.g === 'inbox');
  return head(icon('tray'), '收件箱', 'var(--blue)') + (inbox.length ? '<p class="summary">还没归到项目里的事项</p>' + paged('inbox', inbox, 20, t => todoHTML(t)) : blank('收件箱是空的', '随手记下的事会先放在这里，之后再归到项目'));
}

/* ---------- signing in on another device ---------- */
// A stand-in pattern: the real code holds a link to this server and is drawn by the app.
function qrSVG() {
  const n = 29, b = 4, size = n + b * 2;
  const finder = (x, y) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([fx, fy]) => x >= fx - 1 && x <= fx + 7 && y >= fy - 1 && y <= fy + 7);
  const inFinder = (x, y) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([fx, fy]) => {
    const dx = x - fx, dy = y - fy;
    return dx >= 0 && dx < 7 && dy >= 0 && dy < 7 && (dx % 6 === 0 || dy % 6 === 0 || (dx > 1 && dx < 5 && dy > 1 && dy < 5));
  });
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dark = finder(x, y) ? inFinder(x, y) : ((x * 7 + y * 13 + x * y * 3 + (x ^ y)) % 5 < 2);
    if (dark) d += `M${x + b} ${y + b}h1v1h-1z`;
  }
  return `<svg class="qr" viewBox="0 0 ${size} ${size}" role="img" aria-label="二维码" shape-rendering="crispEdges"><path d="${d}"/></svg>`;
}

function hud(text, undo, label = '撤销') {
  const el = $('hud');
  el.innerHTML = `<span>${text}</span>${undo ? `<button data-hud-undo>${label}</button>` : ''}`;
  el.classList.add('on');
  el.undo = undo;
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => el.classList.remove('on'), 5000);
}
function setMode(m) {
  mode = m;
  if (m !== 'focus') lastMode = m;
  document.body.dataset.mode = m;
  document.querySelectorAll('button[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  renderAll();
  window.scrollTo(0, 0);
}

document.addEventListener('click', ev => {
  const on = sel => ev.target.closest(sel);

  const fx = on('[data-fx]');
  if (fx) return focusAction(fx.dataset.fx);

  const decide = on('[data-decide]');
  if (decide) {
    const p = props[items[open].prop], title = items[open].t, state = decide.dataset.decide;
    p.state = state; open = null; renderAll();
    return hud(`${state === 'accepted' ? '已接受' : '已拒绝'}「${title}」`, () => { p.state = 'pending'; renderAll(); });
  }
  if (on('.pop')) return;

  // A time block opens its focus popover; a click on its checkbox still just ticks it.
  const fp = on('[data-fpop]');
  if (fp && !on('.chk')) { const n = Number(fp.dataset.fpop); openFocus = openFocus === n ? null : n; open = panel = null; return renderAll(); }
  if (openFocus !== null) { openFocus = null; renderCal(); }

  // Anything else closes an open suggestion popover; clicking another pending entry opens that one.
  const opener = on('[data-open]');
  const next = opener ? Number(opener.dataset.open) : null;
  if (open !== null || next !== null) { open = next === open ? null : next; panel = null; renderAll(); if (opener) return; }

  if (on('[data-hud-undo]')) { $('hud').undo(); return $('hud').classList.remove('on'); }

  // "Show more": pretend to fetch, show placeholders meanwhile, then reveal the next batch.
  const mb = on('[data-more]');
  if (mb) {
    const key = mb.dataset.more;
    loading.add(key); renderTasks(); renderPanels();
    return void setTimeout(() => { loading.delete(key); more[key] = Number(mb.dataset.to); renderTasks(); renderPanels(); }, 500);
  }

  const si = on('[data-signin]');
  if (si) { signin = si.dataset.signin === 'close' ? null : si.dataset.signin; return renderPanels(); }

  const toggle = on('[data-panel]');
  if (toggle) { panel = panel === toggle.dataset.panel ? null : toggle.dataset.panel; return renderPanels(); }

  if (on('.panel') || on('.sheet')) {
    if (on('[data-accept-all]')) {
      const ids = Object.keys(props).filter(k => props[k].state === 'pending');
      ids.forEach(k => { props[k].state = 'accepted'; });
      renderAll();
      return hud(`已接受 ${ids.length} 项安排`, () => { ids.forEach(k => { props[k].state = 'pending'; }); renderAll(); });
    }
    if (on('[data-linking]')) linking = !linking;
    const d = on('[data-del]'), u = on('[data-undo]'), th = on('[data-theme-set]');
    if (d) del = d.dataset.del;
    if (u) undone.has(u.dataset.undo) ? undone.delete(u.dataset.undo) : undone.add(u.dataset.undo);
    if (th) document.documentElement.dataset.theme = th.dataset.themeSet;
    return renderPanels();
  }
  if (panel) { panel = null; renderPanels(); }

  const set = on('[data-set]');
  if (set) { load(set.dataset.set); return renderAll(); }

  const fold = on('[data-collapse]');
  if (fold) { const k = fold.dataset.collapse; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); return renderTasks(); }
  if (on('[data-showdone]')) {
    showDone = !showDone;
    if (showDone) { loading.add('logged'); setTimeout(() => { loading.delete('logged'); renderTasks(); }, 450); }   // logged items are fetched only when asked for
    return renderTasks();
  }

  const v = on('[data-view]');
  if (v) { view = v.dataset.view; open = null; return renderCal(); }

  const f = on('[data-filter]');
  if (f) { filter = f.dataset.filter; expanded = null; renderTasks(); return window.scrollTo(0, 0); }

  const md = on('button[data-mode]');
  if (md) return setMode(md.dataset.mode);

  const tg = on('[data-toggle]');
  if (tg) { const id = tg.dataset.toggle; hidden.has(id) ? hidden.delete(id) : hidden.add(id); return renderAll(); }

  const chk = on('[data-task]');
  if (chk) {
    const id = chk.dataset.task, checked = !done.has(id);
    checked ? (done.add(id), fresh.add(id)) : (done.delete(id), fresh.delete(id));
    // Ticking off the item being worked on ends its timer and keeps the time spent.
    if (checked && timer && timer.task === id) { const sec = (Date.now() - timer.start) / 1000; if (timer.kind === 'work' && sec >= 60) record(id, sec); timer = null; }
    chk.classList.toggle('on', checked);               // let the fill animate before re-rendering
    return void setTimeout(renderAll, 220);
  }

  // Suggestion buttons inside an opened item, then opening and closing the card itself.
  const mark = on('[data-imp]');
  if (mark) { const t = tasks.find(x => x.id === mark.dataset.imp); t.imp = !t.imp; return renderTasks(); }

  const sg = on('[data-sg]');
  if (sg) {
    const t = tasks.find(x => x.id === expanded), p = props[t.prop], state = sg.dataset.sg;
    p.state = state; renderAll();
    return hud(`${state === 'accepted' ? '已接受' : '已拒绝'}「${t.t}」`, () => { p.state = 'pending'; renderAll(); });
  }
  const todo = on('.todo');
  if (todo && todo.dataset.id && (on('.tr') || !on('.card'))) { expanded = expanded === todo.dataset.id ? null : todo.dataset.id; renderTasks(); }
});

load('normal');
setMode('tasks');
</script>
</body>
</html>
