<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keduly · 习惯融合设计</title>
<style>
:root{--bg:#fff;--panel:#f4f4f6;--text:#1c1c1e;--muted:#77777d;--line:#e8e8ed;--blue:#007aff;--fill:#e7e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94caff}aside{position:fixed;inset:10px auto 10px 10px;width:248px;border-radius:18px;background:var(--panel);padding:18px 12px;border:1px solid var(--line)}.brand{font-weight:650;font-size:20px;padding:8px 12px 22px}.seg{display:flex;background:var(--fill);border-radius:8px;padding:3px;margin-bottom:24px}.seg button{flex:1;padding:5px;border-radius:6px}.seg .on{background:var(--bg);box-shadow:0 1px 3px #0001}nav button{display:block;width:100%;text-align:left;padding:9px 13px;border-radius:8px}nav button.on{background:var(--fill);font-weight:600}.blue{color:var(--blue)}.muted,small{color:var(--muted)}.project{padding:20px 13px}.project p{font-size:13px;color:var(--muted)}main{margin-left:270px;padding:36px 48px 100px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:48px}.toolbar select{border:0;background:var(--panel);border-radius:6px;padding:6px}.content{max-width:750px;margin:auto}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}h2{font-size:16px;margin:28px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}p{margin:6px 0 20px}.event{border-left:3px solid #8e8e93;padding:4px 12px;margin:22px 0;color:var(--muted);font-size:14px}.row{display:flex;align-items:center;gap:12px;min-height:70px;padding:12px 4px;border-bottom:1px solid var(--line)}.check{width:23px;height:23px;border:1.5px solid #b6b6bd;border-radius:7px;flex:none;padding:0;color:#fff}.check.done{background:var(--blue);border-color:var(--blue)}.title{flex:1;min-width:0;text-align:left;padding:0}.title b{font-weight:500;display:block;overflow-wrap:anywhere}.title small{font-size:12px}.time{color:var(--muted);font-size:13px;flex:none}.skipped b{color:var(--muted)}.done-title b{text-decoration:line-through;color:var(--muted)}.week{display:flex;gap:7px;margin-top:9px}.day{width:28px;height:28px;border-radius:50%;background:var(--panel);font-size:12px;color:var(--muted)}.day.yes{background:#dcecff;color:#007aff}.day.skip{background:transparent;border:1px dashed #aaa}.day.selected{outline:2px solid var(--blue)}.detail{background:var(--panel);border-radius:12px;padding:20px;margin:8px 0 18px}.field{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.field input,.field select{max-width:60%;min-width:0;background:var(--bg);border:1px solid var(--line);padding:6px;border-radius:6px}.actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}.primary{background:var(--blue);color:white;border-radius:8px;padding:8px 15px}.empty{padding:70px 10px;text-align:center}.foot{font-size:12px;color:var(--muted);margin-top:32px}.calendar-row{display:flex;gap:18px;margin:18px 0;min-height:54px}.block{flex:1;border-left:3px solid #30b0c7;background:#30b0c712;border-radius:6px;padding:12px;display:flex;gap:12px}.conflict{color:#b56416;font-size:12px;margin-top:4px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:12px;z-index:5}.mobile-nav,.mobile-link{display:none}.empty button{margin-top:12px} @media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--panel:#29292c;--text:#f4f4f7;--muted:#aaaab2;--line:#3a3a3f;--fill:#3a3a40}.day.yes{background:#143659}}@media(max-width:700px){aside{display:none}.mobile-link{display:inline;color:var(--blue)}main{margin:0;padding:22px 20px 110px}.toolbar{margin-bottom:30px;flex-wrap:wrap}h1{font-size:28px}.mobile-nav{display:flex;position:fixed;bottom:14px;left:20px;right:20px;justify-content:space-around;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:25px}.row{gap:10px}.time{max-width:82px}.field{gap:8px}.week{gap:5px}.day{width:25px;height:25px}.toast{bottom:80px;width:max-content;max-width:90vw}}
</style>
<aside><div class="brand">Keduly</div><div class="seg"><button class="on" onclick="view='today';render()">事项</button><button onclick="view='calendar';render()">日历</button><button onclick="view='focus';render()">专注</button></div><nav><button onclick="say('四象限保持原有结构；这里只演示习惯相关页面')">◫　四象限</button><button id="nav-today" onclick="view='today';render()">☀　今天</button><button onclick="say('接下来会按日期显示每次计划，不提前创建无数任务')">▤　接下来</button><button id="nav-habits" onclick="view='habits';render()">↻　习惯</button><button onclick="say('完成记录继续使用已有已完成列表')">✓　已完成</button></nav><div class="project"><p>个人</p>●　健康与生活</div></aside>
<main><div class="toolbar"><span>概念探索稿 · 正式交互以本地应用为准</span><button class="mobile-link" onclick="view='habits';render()">习惯</button><label>场景 <select id="scenario" onchange="scenario=this.value;selected=null;render()"><option value="normal">日常</option><option value="busy">拥挤</option><option value="empty">空白</option></select></label></div><div class="content" id="app"></div></main><div class="mobile-nav"><button onclick="view='today';render()">事项</button><button onclick="view='calendar';render()">日历</button><button onclick="view='focus';render()">专注</button></div>
<script>
let view='today',scenario='normal',selected=null,recordDay=6;
function recordDone(id){let h=habits[id];h.history[recordDay]='yes';if(recordDay===6){h.state='done';h.actual=h.actual||h.time;}render();say('已补记所选日期，可撤销')}
function moveToday(id,value){habits[id].todayTime=value;render();say('仅调整今天，后续计划不变')}
const habits=[{id:0,title:'晚饭后走 20 分钟',time:'18:40',duration:20,freq:'每天',reminder:'准时',state:'open',actual:'',history:['yes','yes','skip','yes','','yes','']},{id:1,title:'结束工作，写下明天第一步',time:'23:00',duration:10,freq:'每天',reminder:'准时',state:'open',actual:'',history:['yes','','yes','yes','','yes','']},{id:2,title:'上床休息',time:'00:00',duration:0,freq:'每天',reminder:'提前 15 分钟',state:'open',actual:'',history:['yes','','yes','','','yes','']}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),3000)}
function toggle(id){let h=habits[id];h.state=h.state==='done'?'open':'done';h.history[6]=h.state==='done'?'yes':'';h.actual=h.state==='done'?(h.time==='00:00'?'00:12':h.time):'';render();say(h.state==='done'?'已记录本次完成 · 可再次点击撤销':'已撤销本次完成')}
function skip(id){habits[id].state='skipped';habits[id].history[6]='skip';render();say('只跳过本次，下一次仍按计划出现')}
function rows(){return habits.map(h=>`<div class="row ${h.state==='skipped'?'skipped':''}"><button aria-label="${h.state==='done'?'撤销':'完成'}${esc(h.title)}" class="check ${h.state==='done'?'done':''}" onclick="toggle(${h.id})">${h.state==='done'?'✓':''}</button><button class="title ${h.state==='done'?'done-title':''}" onclick="selected=selected===${h.id}?null:${h.id};recordDay=6;render()"><b>${esc(h.title)}</b><small>↻ ${h.freq} · ${h.state==='skipped'?'今天已跳过':h.state==='done'?'已完成 '+h.actual:'健康与生活'+(h.duration?' · '+h.duration+' 分钟':'')}</small></button><span class="time">${(h.todayTime||h.time)==='00:00'?'次日 00:00':esc(h.todayTime||h.time)}</span></div>${selected===h.id?detail(h):''}`).join('')}
function detail(h){return `<div class="detail"><div class="field"><span>重复</span><select onchange="habits[${h.id}].freq=this.value;say('演示：规则修改从下一次起生效')">${['每天','工作日','每周一、三、五'].map(x=>`<option ${h.freq===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><span>以后每天的时间</span><input aria-label="计划时间" type="time" value="${h.time}" onchange="habits[${h.id}].time=this.value;render();say('演示：已调整计划时间')"></div><div class="field"><span>提醒</span><select onchange="habits[${h.id}].reminder=this.value">${['准时','提前 15 分钟','不提醒'].map(x=>`<option ${h.reminder===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><span>实际完成时间</span><input aria-label="实际完成时间" type="time" value="${h.actual}" onchange="habits[${h.id}].actual=this.value;say('已修正记录，不改变计划时间')"></div><div class="field"><span>仅调整今天</span><input aria-label="仅调整今天" type="time" value="${h.todayTime||h.time}" onchange="moveToday(${h.id},this.value)"></div><h2>本周记录</h2><div class="week">${h.history.map((s,i)=>`<button aria-label="查看星期${i+1}记录" class="day ${s} ${recordDay===i?'selected':''}" onclick="recordDay=${i};render()">${s==='yes'?'✓':s==='skip'?'−':['一','二','三','四','五','六','日'][i]}</button>`).join('')}</div><p class="foot">星期${['一','二','三','四','五','六','日'][recordDay]} · ${h.history[recordDay]==='yes'?'已完成':h.history[recordDay]==='skip'?'已跳过':recordDay===6?'尚未完成':'未完成'}</p><div class="actions"><button class="blue" onclick="recordDone(${h.id})">补记完成</button><button class="blue" onclick="habits[${h.id}].history[recordDay]='';if(recordDay===6)habits[${h.id}].state='open';render()">撤销所选记录</button><button class="blue" onclick="skip(${h.id})">跳过今天</button><button class="blue" onclick="say('正式版：暂停后不再生成未来计划；保留历史记录')">暂停习惯…</button></div></div>`}
function render(){document.querySelectorAll('nav button').forEach(n=>n.classList.remove('on'));document.querySelector('#nav-'+view)?.classList.add('on');let a=document.querySelector('#app');if(scenario==='empty'){a.innerHTML='<h1>习惯</h1><div class="empty"><h2>把想坚持的事，放进每一天</h2><p class="muted">设置重复和时间，它会出现在「今天」。</p><button class="primary" onclick="scenario=\'normal\';document.querySelector(\'#scenario\').value=\'normal\';view=\'habits\';selected=0;render()">添加第一个习惯</button></div>';return}if(view==='today'){a.innerHTML=`<h1>今天 <small style="font-size:16px;font-weight:400">星期日 · 10 月 18 日</small></h1><p class="muted">${habits.filter(h=>h.state==='open').length} 项习惯待完成</p>${scenario==='busy'?'<h2>逾期</h2><div class="row">□　整理项目文档 <small>昨天截止</small></div>':''}<h2>事项</h2><div class="row"><button class="check" aria-label="完成普通任务" onclick="this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓':''"></button><div class="title"><b>整理本周项目进展</b><small>工作 · 30 分钟</small></div><time class="time">15:00</time></div>${scenario==='busy'?Array.from({length:6},(_,i)=>'<div class="row"><span>□</span><div class="title"><b>核对设计、处理反馈与跨设备同步边界 '+(i+1)+'</b><small>项目 · 30 分钟</small></div></div>').join(''):''}<h2>今晚</h2><div class="event">18:00　晚饭</div>${scenario==='busy'?'<div class="event">18:30—19:30　项目讨论</div><div class="conflict">快走与项目讨论重叠，点击快走调整今天的时间。</div>':''}${rows()}<p class="foot">凌晨的「上床休息」归入今晚，日历仍显示实际的次日日期。</p>`}else if(view==='habits'){a.innerHTML=`<h1>习惯</h1><p class="muted">10 月 12—18 日</p>${habits.map(h=>`<div class="row"><button class="title" onclick="selected=selected===${h.id}?null:${h.id};render()"><b>${esc(h.title)}</b><small>${h.freq} · ${h.time} · 本周完成 ${h.history.filter(x=>x==='yes').length}/7 · 跳过 ${h.history.filter(x=>x==='skip').length} 次</small><div class="week">${h.history.map((s,i)=>`<span class="day ${s}" style="display:grid;place-items:center">${s==='yes'?'✓':s==='skip'?'−':['一','二','三','四','五','六','日'][i]}</span>`).join('')}</div></button><span class="muted">›</span></div>${selected===h.id?detail(h):''}`).join('')}<p class="foot">✓ 已完成　− 已跳过　空白为未完成或尚未到期；点击习惯查看每日记录。</p>`}else if(view==='calendar'){a.innerHTML=`<h1>10 月 18 日</h1><p class="muted">日历 · 星期日</p><div class="calendar-row"><time>18:00</time><div class="block">晚饭</div></div>${habits.map(h=>`<div class="calendar-row"><time>${(h.todayTime||h.time)==='00:00'?'19 日<br>00:00':(h.todayTime||h.time)}</time><div class="block"><button class="check ${h.state==='done'?'done':''}" aria-label="日历中完成${esc(h.title)}" onclick="toggle(${h.id})">${h.state==='done'?'✓':''}</button><button class="title" onclick="selected=h.id;view='today';render()">${esc(h.title)}<br><small>↻ ${h.freq}${h.duration?' · '+h.duration+' 分钟':' · 时间点'}</small></button></div></div>`).join('')}`}else{a.innerHTML='<h1>专注</h1><div class="empty"><p class="muted">本轮第 2 个番茄已结束</p><div style="font-size:76px;font-weight:200">05:00</div><p>起身走一走，离开屏幕</p><button class="primary" onclick="say(\'演示：用户主动开始休息，不自动启动计时\')">开始休息</button></div><p class="foot">继续使用现有番茄休息，不生成一天几十条习惯事项。</p>'}}
render();
</script></html>
